<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>录课助手</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .backend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .status-dot.online {
        background: var(--ok);
        box-shadow: 0 0 6px rgba(24, 160, 88, 0.5);
      }
      .status-dot.offline {
        background: #e5484d;
      }
      .status-text {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .backend-url {
        flex: 1;
        min-width: 200px;
        padding: 6px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        font-family: inherit;
        color: var(--muted);
      }
      .backend-url:focus {
        border-color: var(--primary);
        color: var(--text);
      }

      .prog-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
      }
      .prog-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fafbfc;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .prog-card.running {
        border-color: var(--ok);
        background: #f0fdf4;
      }
      .prog-icon {
        font-size: 22px;
        line-height: 1;
        flex-shrink: 0;
      }
      .prog-info {
        flex: 1;
        min-width: 0;
      }
      .prog-name {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .prog-state {
        font-size: 11px;
        color: var(--muted);
      }
      .prog-state.running {
        color: var(--ok);
      }

      .action-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }
      .btn-start,
      .btn-stop {
        flex: 1;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        border: none;
        transition:
          background 0.15s,
          opacity 0.15s;
      }
      .btn-start {
        color: #fff;
        background: var(--ok);
      }
      .btn-start:hover {
        background: #0f9050;
      }
      .btn-stop {
        color: #fff;
        background: #e5484d;
      }
      .btn-stop:hover {
        background: #d33d42;
      }
      .btn-start:disabled,
      .btn-stop:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .log-area {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #1e2228;
        min-height: 200px;
        max-height: 360px;
        overflow-y: auto;
        padding: 14px 16px;
        font-family: "Cascadia Code", "Consolas", "Monaco", monospace;
        font-size: 13px;
        line-height: 1.7;
        color: #c8d3e0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .log-placeholder {
        color: #5a6370;
        font-style: italic;
      }
      .log-area::-webkit-scrollbar {
        width: 6px;
      }
      .log-area::-webkit-scrollbar-thumb {
        background: #3a4050;
        border-radius: 3px;
      }

      .info-box {
        margin-top: 20px;
        padding: 14px 16px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .info-box strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>录课助手</h1>
        <p class="sub">一键启停视频课程录制的四个辅助程序</p>

        <div class="backend-row">
          <span class="status-dot" id="backendDot"></span>
          <span class="status-text" id="backendText">检测中...</span>
          <input
            type="text"
            class="backend-url"
            id="backendUrl"
            value="http://localhost:18789"
            placeholder="后台地址"
          />
        </div>

        <div class="prog-grid" id="progGrid"></div>

        <div class="action-row">
          <button class="btn-start" id="btnStart" disabled>启动录课</button>
          <button class="btn-stop" id="btnStop" disabled>停止录课</button>
        </div>

        <div class="log-area" id="logArea">
          <div class="log-placeholder">操作日志将显示在这里</div>
        </div>

        <div class="info-box">
          <strong>启动顺序</strong>：NVIDIA Broadcast → PointerFocus → Carnac →
          Recordly（每步间隔 3 秒）<br />
          <strong>关闭顺序</strong>：Recordly → Carnac → PointerFocus → NVIDIA
          Broadcast（反向）<br />
          <strong>音频链路</strong>：麦克风 → NVIDIA Broadcast（降噪） →
          Recordly（录制）<br />
          <strong>注意</strong>：仅支持 Windows 11 环境，使用前请先双击
          <code>start-server.bat</code> 启动后台
        </div>
      </div>
    </div>

    <script src="../../base.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
