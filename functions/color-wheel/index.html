<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>色轮取色器</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .wheel-stage {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 8px auto 4px;
        touch-action: none;
      }
      #wheel {
        display: block;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        cursor: crosshair;
        box-shadow: var(--shadow);
      }
      .bubble {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: rgba(31, 35, 41, 0.92);
        color: #fff;
        border-radius: 8px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        white-space: nowrap;
      }
      .bubble .swatch {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .readout {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        padding: 14px 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .readout .chip {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        flex: none;
      }
      .readout .val {
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }
      .readout .meta {
        margin-left: auto;
        text-align: right;
        color: var(--muted);
        font-size: 12px;
      }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .hint kbd {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--card);
        font-family: inherit;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="../../index.html">← 返回功能中心</a>
    <div class="wrap">
      <div class="card">
        <h1>色轮取色器</h1>
        <p class="sub">
          鼠标移到色轮上实时读取像素颜色，按 C 在 HEX / RGB 间切换，单击复制
        </p>

        <div class="wheel-stage">
          <canvas id="wheel" width="320" height="320"></canvas>
        </div>

        <div class="readout">
          <div class="chip" id="chip"></div>
          <div class="val" id="val">—</div>
          <div class="meta">
            <div id="modeLabel">格式：HEX</div>
            <div id="posLabel">—</div>
          </div>
        </div>

        <p class="hint">
          移动鼠标查看颜色 · <kbd>C</kbd> 切换 HEX / RGB · 单击色轮复制当前值
        </p>
      </div>
    </div>

    <div class="bubble" id="bubble">
      <span class="swatch" id="bubbleSwatch"></span>
      <span id="bubbleText">—</span>
    </div>

    <script src="../../base.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
